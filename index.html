<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UEFA Champions League – Acceso VIP</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <!-- Font Awesome 6 (iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Tu CSS mejorado -->
    <link rel="stylesheet" href="login.css" />
</head>
<body>

    <!-- FONDO DINÁMICO (sin necesidad de div extra) -->
    <div class="login-wrapper">
        <div class="login-card">

            <!-- COPA CON ANIMACIÓN -->
            <img src="imagenes/copa.png" alt="Champions Trophy" class="copa" />

            <h1>
                <i class="fas fa-futbol" style="margin-right: 8px; color: #ffd700;"></i>
                UEFA CHAMPIONS LEAGUE
            </h1>
            <p class="subtitulo">
                <i class="fas fa-ticket-alt"></i> Acceso oficial para fanáticos del fútbol europeo
            </p>

            <!-- FORMULARIO -->
            <form id="loginForm">
                <div class="input-group">
                    <label for="usuario">
                        <i class="fas fa-user"></i> Usuario o correo
                    </label>
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="text" id="usuario" placeholder="tu@email.com o nombre" />
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Contraseña
                    </label>
                    <div class="input-icon">
                        <i class="fas fa-key"></i>
                        <input type="password" id="password" placeholder="••••••••" />
                    </div>
                </div>

                <button type="submit" class="btn-ingresar">
                    <i class="fas fa-sign-in-alt"></i> INGRESAR
                </button>
            </form>

            <div class="opciones">
                <a href="#"><i class="fas fa-question-circle"></i> ¿Olvidaste tu contraseña?</a>
                <span>|</span>
                <a href="#"><i class="fas fa-user-plus"></i> Crear cuenta</a>
            </div>

            <p class="extra">
                <i class="fas fa-star" style="color: #ffd700;"></i>
                Vive la emoción de la Champions
                <i class="fas fa-star" style="color: #ffd700;"></i>
                <br />
                <span style="font-size: 0.9rem;">🏆 Solo los mejores entran al estadio</span>
            </p>

            <!-- Sello decorativo -->
            <div class="sello">
                <i class="fas fa-shield-alt"></i> 2026 · Official
            </div>

        </div>
    </div>

    <script>
        // Redirección al enviar el formulario (puedes cambiarlo)
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'principal.html';
        });
    </script>
</body>
</html>
