<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UEFA Champions League Login</title>

    <link rel="stylesheet" href="index.html">
</head>
<body>

    <div class="fondo"></div>

<div class="login">

    <img src="imagenes/copa.png" class="copa">

    <h1>UEFA CHAMPIONS LEAGUE</h1>

    <p class="subtitulo">Acceso oficial para fanáticos del fútbol europeo</p>

    <!-- USUARIO -->
    <label>Usuario o correo</label>
    <input type="text" placeholder="Ingresa tu usuario o correo">

    <!-- CONTRASEÑA -->
    <label>Contraseña</label>
    <input type="password" placeholder="Ingresa tu contraseña">

    <button onclick="ingresar()">INGRESAR</button>

    <div class="opciones">
        <a href="#">¿Olvidaste tu contraseña?</a>
        <span>|</span>
        <a href="#">Crear cuenta</a>
    </div>

   

    <p class="extra">
        ⚽ Vive la emoción de la Champions • 🏆 Solo los mejores entran al estadio
    </p>

</div>

<script>
function ingresar(){
    window.location.href="principal.html";
}
</script>
</body>
</html>
